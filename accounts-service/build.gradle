plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:1.0.2'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Spring Modulith
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-events-jpa'
    implementation 'org.springframework.modulith:spring-modulith-events-core'
    
    // jMolecules for DDD annotations
    implementation 'org.jmolecules:jmolecules-ddd:1.5.0'
    implementation 'org.jmolecules:jmolecules-onion-architecture:1.5.0'
    implementation 'org.jmolecules:jmolecules-events:1.9.0'
    
    // Database
    runtimeOnly 'com.h2database:h2'
    
    // API Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // Note: jmolecules-archunit might not be available in 1.5.0
    // testImplementation 'org.jmolecules:jmolecules-archunit:1.5.0'
}

test {
    useJUnitPlatform()
}

