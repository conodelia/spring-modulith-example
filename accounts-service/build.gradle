plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:2.0.0'
        mavenBom 'org.jmolecules:jmolecules-bom:2025.0.0'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Spring Modulith
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-events-jpa'
    implementation 'org.springframework.modulith:spring-modulith-events-core'
    
    // jMolecules for DDD annotations (versions managed by BOM)
    implementation 'org.jmolecules:jmolecules-ddd'
    implementation 'org.jmolecules:jmolecules-onion-architecture'
    implementation 'org.jmolecules:jmolecules-events'
    
    // Database
    runtimeOnly 'com.h2database:h2'
    
    // API Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4.0: Test modules are now separate - add webmvc test module for @WebMvcTest
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // Spring Boot 4.0: Add test autoconfigure for @MockBean support
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    // Note: jmolecules-archunit might not be available in 1.5.0
    // testImplementation 'org.jmolecules:jmolecules-archunit:1.5.0'
}

test {
    useJUnitPlatform()
}

