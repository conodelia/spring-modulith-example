spring.application.name=transfers-service

# Server
server.port=8081

# Database
spring.datasource.url=jdbc:h2:mem:transfersdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Modulith
spring.modulith.events.jpa.enabled=true

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Accounts Service Integration (HTTP)
accounts.service.url=http://localhost:8080
accounts.service.api.base-path=/api

